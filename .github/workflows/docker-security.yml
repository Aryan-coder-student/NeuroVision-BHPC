name: Docker Security Scan

on:
  push:
    branches: [ "deploy/docker-security", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t neurovision-backend:latest ./backend

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'neurovision-backend:latest'
          format: 'json'
          output: 'trivy-results.json'
          exit-code: '0' # Policy gate below preserves failing behavior with target-level diagnostics
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Report targets and enforce security policy
        shell: bash
        run: |
          jq -r '.Results[]? | select((.Vulnerabilities // []) | length > 0) | "TARGET: \(.Target) | TYPE: \(.Type)\n" + ((.Vulnerabilities // []) | map("  \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion // "unfixed") [\(.Severity)] \(.VulnerabilityID)") | join("\n"))' trivy-results.json
          jq -c '.Results[]? | select(.Target == "Python") | {Target, Packages: [.Packages[]? | select(.Name == "msgpack" or .Name == "setuptools" or .Name == "urllib3")], Vulnerabilities: [.Vulnerabilities[]? | {PkgName, InstalledVersion, PkgID, PkgPath, Layer}]}' trivy-results.json
          findings=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length' trivy-results.json)
          echo "HIGH/CRITICAL findings: $findings"
          if [ "$findings" -gt 0 ]; then
            echo '::error::Trivy security gate failed. See affected targets above.'
            exit 1
          fi
