name: Backend CI

on:
  push:
    branches: [ main, deploy/render-orchestration, feat/neuro-analytics-core ]
  pull_request:
    branches: [ main, deploy/render-orchestration, feat/neuro-analytics-core ]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync
      - name: Run Ruff
        run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: multitenant
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENV: development
      ENCRYPTION_KEY: "dummy-key-for-testing-only-1234567890="
      DATABASE_URL: "postgres://myuser:mypassword@localhost:5432/multitenant"
      SECRET_KEY: "ci-test-secret-key"

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync
        working-directory: backend
      
      - name: Run Tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          uv run python manage.py test users.auth.tests --noinput
        working-directory: backend/platform_api
