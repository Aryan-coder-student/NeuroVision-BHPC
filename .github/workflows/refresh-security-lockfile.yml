name: Refresh Security Lockfile
on:
  push:
    branches: [fix/ci-test-config-and-security-report]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.ref == 'refs/heads/fix/ci-test-config-and-security-report'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - name: Resolve patched dependencies
        working-directory: backend
        run: uv lock --upgrade
      - name: Commit reproducible lockfile
        run: |
          if git diff --quiet -- backend/uv.lock; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/uv.lock
          git commit -m "fix(deps): regenerate uv lock with patched packages"
          git push origin HEAD:fix/ci-test-config-and-security-report
