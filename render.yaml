services:
  # --- Backend Service (Docker) ---
  - type: web
    name: neurovision-backend
    env: docker
    repo: https://github.com/Aryan-coder-student/NeuroVision-BHPC
    branch: main
    rootDir: backend
    plan: free
    envVars:
      - key: DEBUG
        value: "False"
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # Set your Neon URL manually in the Render dashboard
      - key: TENANT_BASE_DOMAIN
        value: "neurovision-backend-99o7.onrender.com"
      - key: ENCRYPTION_KEY
        sync: false # Set your Fernet key manually in the Render dashboard
      - key: ALLOWED_HOSTS
        value: ".onrender.com"

  # --- Frontend Service (Static) ---
  - type: web
    name: neurovision-frontend
    runtime: static
    repo: https://github.com/Aryan-coder-student/NeuroVision-BHPC
    branch: main
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: dist
    # React Router handles dashboard/workspace paths in the browser.
    # Without this, direct links and reloads such as /dashboard return 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://neurovision-backend-99o7.onrender.com/api/v1
